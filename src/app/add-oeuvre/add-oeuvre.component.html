<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-light">
      <h2>Ajouter une Oeuvre :</h2>
    </div>
    <div class="card-body">
      <form (ngSubmit)="addOeuvre()">
        <div class="col-sm-2 col-md-2 col-lg-2 mb-3">
          <label class="form-label">ID Oeuvre</label>
          <input type="number" [(ngModel)]="newOeuvre.idOeuvre" name="idOeuvre" class="form-control" required>
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Titre Oeuvre</label>
          <input type="text" [(ngModel)]="newOeuvre.titreOeuvre" name="titreOeuvre" class="form-control" required>
        </div>

        <div class="col-sm-2 col-md-2 col-lg-2 mb-3">
          <label class="form-label">Prix Oeuvre</label>
          <input type="number" [(ngModel)]="newOeuvre.prixOeuvre" name="prixOeuvre" class="form-control" required>
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
          <label class="form-label">Date création</label>
          <input type="date" [(ngModel)]="newOeuvre.dateCreation" name="dateCreation" class="form-control" required>
        </div>

        <div class="mt-3">
          <button type="submit" class="btn btn-success">
            Ajouter
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
